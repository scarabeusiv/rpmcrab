reason = "New port-only Warning with no reference counterpart: a D-Bus system policy file whose <policy group=...> names a group declared nowhere emits W dbus-policy-unknown-group. The same declared-ness rules as the unit arms apply (own sysusers.d, group(<name>) Requires, StandardGroups table, numeric id). No Factory corpus census was run for this POC entry; the firing shape is pinned by unit tests only. Pinned by dbus_policy_subjects_fire_and_stay_quiet in systemd_users.rs and policy_subjects_collects_user_and_group in dbus_policy.rs. Its staged description lives in crates/rpmcrab-core/data/descriptions/SystemdUsersCheck.toml."
